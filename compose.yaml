name: securelens

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      API_DOCS_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-5}"
      ANALYSIS_TIME_BUDGET_SECONDS: "${ANALYSIS_TIME_BUDGET_SECONDS:-40}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-10}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      TRUST_PROXY_HEADERS: "true"
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-12}"
    expose:
      - "8000"
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    cpus: "1.0"
    # Starlette's multipart parser spools the whole request body here
    # before the handler's size check runs, so cap the mount explicitly
    # rather than letting it default to half of host RAM. Nginx's
    # client_max_body_size (8m) keeps oversized bodies from reaching it;
    # 16m leaves room for a couple of concurrent spooled uploads.
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - securelens

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-5}"
    # No published host port: this stack is reached exclusively through
    # the cloudflared sidecar below, over this internal network. Nothing
    # outside Docker can reach nginx at all, which is what lets
    # frontend/nginx.conf trust CF-Connecting-IP from the whole
    # securelens subnet (see the comment there) instead of one pinned
    # address - there's no host-published port for a client to reach
    # nginx through except via that sidecar.
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # nginx:alpine starts as root, chowns its cache/run dirs, drops to
    # the nginx user, and binds :80 - so it needs these four back.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    cpus: "0.5"
    networks:
      - securelens

  # The only path into the stack: cloudflared makes an outbound
  # connection to Cloudflare and proxies inbound requests to nginx at
  # frontend:80 over this internal network. Gated behind a profile so a
  # plain `docker compose up` (CI, local smoke testing) doesn't require a
  # real tunnel token - start it deliberately with
  # `docker compose --profile cloudflare-tunnel up -d` after setting
  # CLOUDFLARE_TUNNEL_TOKEN in the root .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - cloudflare-tunnel
    restart: unless-stopped
    networks:
      - securelens

networks:
  securelens:
    driver: bridge
    # Fixed subnet so frontend/nginx.conf can trust it by CIDR
    # (set_real_ip_from) rather than a broad default range. Trusting this
    # whole subnet - not one pinned address - is safe specifically
    # because the frontend publishes no host port: nginx has no
    # TCP-reachable path from outside Docker at all, so anything that can
    # present CF-Connecting-IP to it already had to reach it over this
    # network, which only our own containers (backend, frontend,
    # cloudflared) join.
    ipam:
      config:
        - subnet: 172.30.0.0/24
