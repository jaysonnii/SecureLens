name: securelens

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      API_DOCS_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-25}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-10}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      TRUST_PROXY_HEADERS: "true"
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    expose:
      - "8000"
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - securelens

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-25}"
    ports:
      - "${SECURELENS_BIND_ADDRESS:-127.0.0.1}:${SECURELENS_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - securelens

networks:
  securelens:
    driver: bridge
