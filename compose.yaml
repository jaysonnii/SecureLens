name: securelens

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      API_DOCS_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-25}"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-10}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      TRUST_PROXY_HEADERS: "true"
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    expose:
      - "8000"
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    cpus: "1.0"
    # Starlette's multipart parser spools the whole request body here
    # before the handler's size check runs, so cap the mount explicitly
    # rather than letting it default to half of host RAM. Nginx's
    # client_max_body_size (28m) keeps oversized bodies from reaching it.
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - securelens

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-25}"
    ports:
      - "${SECURELENS_BIND_ADDRESS:-127.0.0.1}:${SECURELENS_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # nginx:alpine starts as root, chowns its cache/run dirs, drops to
    # the nginx user, and binds :80 - so it needs these four back.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    pids_limit: 128
    cpus: "0.5"
    networks:
      - securelens

networks:
  securelens:
    driver: bridge
