server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The backend enforces the upload size limit (MAX_FILE_SIZE_MB,
    # default 25, range 1-100). This ceiling sits just above the default
    # plus multipart overhead: uploads up to ~27 MB reach the backend and
    # get its JSON size error, larger ones are cut off here so an
    # unvalidated body never buffers to the backend's /tmp spool.
    # If MAX_FILE_SIZE_MB is raised above ~27, raise this to about
    # MAX_FILE_SIZE_MB + 3m (and the backend tmpfs size= past the new
    # max), then rebuild the frontend image - otherwise oversized uploads
    # get a stock Nginx 413 instead of the backend's error.
    client_max_body_size 28m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
