server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Behind Cloudflare Tunnel, cloudflared makes an outbound connection
    # to Cloudflare and proxies inbound requests to us over our own
    # Docker network - nginx never sees a public source address at the
    # TCP layer, so $remote_addr is always the tunnel sidecar's address,
    # not the visitor's. Trust CF-Connecting-IP (the client IP Cloudflare
    # asserts) only when the TCP connection genuinely comes from our own
    # network - the same "genuinely behind our own proxy" boundary the
    # backend's TRUST_PROXY_HEADERS relies on, just drawn one hop further
    # out.
    #
    # 172.30.0.0/24 is the securelens Docker network (pinned in
    # compose.yaml), not a broad default range - trusting it is safe only
    # because the frontend service publishes no host port (see
    # compose.yaml). With no TCP path into nginx from outside Docker,
    # every peer that can present a CF-Connecting-IP header here already
    # had to be on this network, and the only containers on it are our
    # own (backend, frontend, cloudflared) - nothing an external attacker
    # can join, and no published port for Docker's loopback NAT to
    # hairpin an outside connection through and appear as if from inside
    # this range. A directly-exposed deployment (ports: republished, or
    # this compose file adapted for a different topology) MUST go back to
    # naming cloudflared's own address here rather than the whole subnet.
    # If cloudflared runs elsewhere (host networking, a different
    # network), update this to match - a mismatch here doesn't break
    # traffic, it just silently falls back to today's degraded
    # single-bucket limit.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # The backend enforces the upload size limit (MAX_FILE_SIZE_MB,
    # default 5, range 1-100). This ceiling sits just above the default
    # plus multipart overhead: uploads up to ~7 MB reach the backend and
    # get its JSON size error, larger ones are cut off here so an
    # unvalidated body never buffers to the backend's /tmp spool.
    # If MAX_FILE_SIZE_MB is raised above ~7, raise this to about
    # MAX_FILE_SIZE_MB + 3m (and the backend tmpfs size= past the new
    # max), then rebuild the frontend image - otherwise oversized uploads
    # get a stock Nginx 413 instead of the backend's error.
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
